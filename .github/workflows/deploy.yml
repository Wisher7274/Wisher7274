name: Deploy Vue to Main Root

on:
  push:
    branches: [ main ]
    # 仅当 vue 子目录下的文件发生变化时才触发，避免无效构建
    paths:
      - 'rdmyself_vue/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 【关键】赋予工作流对 main 分支的写入权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保留完整历史，防止覆盖时丢失其他文件

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rdmyself_vue/package-lock.json # 指定子目录的锁文件

      - name: Install & Build
        working-directory: ./rdmyself_vue # 【关键】指定工作目录为 vue 子目录
        run: |
          npm ci
          npm run build

      - name: Deploy to Main Branch Root
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rdmyself_vue/dist # 指向子目录的构建产物
          publish_branch: main             # 强制发布到 main 分支
          destination_dir: .               # 【关键】发布到目标分支的根目录
          keep_files: true                 # 【安全锁】保留 main 分支上已有的非构建文件
          commit_message: "chore: auto deploy from rdmyself_vue"