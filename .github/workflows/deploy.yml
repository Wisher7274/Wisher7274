name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src-astro/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: src-astro/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src-astro
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src-astro
        run: pnpm build

      - name: Deploy (commit docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "📦 Deploy Astro build [skip ci]"
            git push
          fi
